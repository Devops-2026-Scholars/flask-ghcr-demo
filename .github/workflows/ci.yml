name: CI Pipeline

on:
  push:
    branches:
      - 'feature/**'
      - 'fix/**'
      - 'main'
  pull_request:
    branches:
      - main
    
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies and security tools
        run: | 
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit pip-audit

      - name: Run Bandit (Static Application Security Testing)
        run: |
          # Scans Python code recursively for common security vulnerabilities
          bandit -r . -x ./tests

      - name: Run Pip-Audit (Dependency Vulnerability Scanner)
        run: |
          # Checks installed packages against known CVE databases
          pip-audit
          
      - name: Test Docker Build (Dry Run)
        run: docker build -t flask-test:latest .
